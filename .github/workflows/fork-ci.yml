name: Fork CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: fork-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm test
      - run: npm run tsc
      - run: npm run lint
      - run: npx expo export --platform ios --output-dir dist-validation
